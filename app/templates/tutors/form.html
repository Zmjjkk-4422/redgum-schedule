{% extends "base.html" %}
{% block title %}{% if tutor %}Edit tutor{% else %}New tutor{% endif %}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% if tutor %}Edit tutor: {{ tutor.name }}{% else %}New tutor{% endif %}</h1>
<form method="post" class="row g-3" style="max-width: 720px;">
  <div class="col-md-8">
    <label class="form-label" for="name">Full name *</label>
    <input class="form-control" id="name" name="name" required value="{{ data.name or '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label" for="max_sessions_week">Max sessions / week (optional)</label>
    <input class="form-control" id="max_sessions_week" name="max_sessions_week" type="number" min="1" value="{{ data.max_sessions_week or '' }}">
  </div>
  <div class="col-12">
    <label class="form-label" for="subjects">Subjects taught (comma separated) *</label>
    <input class="form-control" id="subjects" name="subjects" placeholder="e.g. Physics, Chemistry, Math Methods" value="{{ data.subjects or '' }}">
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">{% if tutor %}Save changes{% else %}Create tutor{% endif %}</button>
    <a class="btn btn-link" href="{{ url_for('tutors.index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
